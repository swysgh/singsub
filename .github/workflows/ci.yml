name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build
        run: go build -buildvcs=false ./...

      - name: Vet
        run: go vet -buildvcs=false ./...

      - name: gofmt clean
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            while IFS= read -r f; do
              echo "::error file=$f,line=1::$f 未通过 gofmt，运行 gofmt -w $f 修复"
            done <<< "$unformatted"
            echo "--- gofmt -d 预览 ---"
            gofmt -d .
            exit 1
          fi

      - name: Test
        run: go test ./... -v